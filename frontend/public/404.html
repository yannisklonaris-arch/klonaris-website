<!DOCTYPE html>
<html>

    <meta charset="utf-8" />
    <title>Klonaris</title>
    <script>
      const route =

        window.location.search +
        window.location.hash;

      window.location.replace(
        "/?redirect=" + encodeURIComponent(route)
      );
    </script>
