<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Klonaris</title>
    <script>
      const path = window.location.pathname;
      const repo = "/klonaris-website";

      if (path.startsWith(repo)) {
        const route = path.slice(repo.length) || "/";
        window.location.replace(
          repo + "/?redirect=" + encodeURIComponent(route)
        );
      } else {
        window.location.replace(repo + "/");
      }
    </script>
  </head>
  <body></body>
</html>
